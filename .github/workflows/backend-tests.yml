name: Backend tests

on:
  pull_request:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  # Called by the deploy workflows, which own the push path — running on push
  # here as well would duplicate the work and cancel itself via `concurrency`.
  workflow_call:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # The suite relies on jsonb, ilike and aggregate FILTER, so it runs on
        # the same engine as production — never SQLite.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadflow_testing
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U leadflow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-8.4-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test
        continue-on-error: false

      # Before the suite, not inside it: a test class that shadows PHPUnit's
      # final run() aborts at class load and takes every other test with it,
      # so no test can catch this one.
      - name: Check test helpers
        run: ./scripts/check-test-helpers.sh

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leadflow_testing
          DB_USERNAME: leadflow
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Run the test suite
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leadflow_testing
          DB_USERNAME: leadflow
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: predis
        run: php artisan test

      # Tenant isolation is the guarantee the whole product rests on, so it gets
      # its own step: if it fails, the reason is unmistakable in the log.
      - name: Verify tenant isolation
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leadflow_testing
          DB_USERNAME: leadflow
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: predis
        run: php artisan test --filter=TenantIsolationTest
