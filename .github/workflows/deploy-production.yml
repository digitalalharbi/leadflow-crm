name: Deploy production

# Production is manual and approved: it never runs on a push. Someone starts it, types
# the word "deploy", and it runs only when the owner has switched production on
# (repository variable PRODUCTION_ENABLED=true) after the server, the domain, HTTPS,
# the secrets and the backups exist (docs/PRODUCTION_RUNBOOK.md). Until then it says
# PRODUCTION NOT CONFIGURED and ends — which is a state, not a failure.
#
# The one-command path from a maintainer's machine is scripts/release-production.sh,
# which runs the same preflight, backup, migrate, health, smoke and verification, with
# automatic rollback.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm
        required: true
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  # Production has not been switched on: say so, and record no deployment.
  awaiting:
    name: Production not configured
    if: vars.PRODUCTION_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          {
            echo "### PRODUCTION NOT CONFIGURED"
            echo "Nothing was deployed and no deployment was recorded."
            echo "Set up the server, domain, HTTPS, secrets and backups (docs/PRODUCTION_RUNBOOK.md),"
            echo "then set the repository variable PRODUCTION_ENABLED=true."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Production not configured::Nothing deployed."

  # The app must boot and the schema must apply cleanly against an empty database
  # before the VPS is touched.
  verify:
    name: Pre-flight verification
    if: vars.PRODUCTION_ENABLED == 'true' && github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadflow_verify
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U leadflow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, intl, zip
          tools: composer:v2

      - name: Install production dependencies
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Validate the production configuration
        working-directory: backend
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leadflow_verify
          DB_USERNAME: leadflow
          DB_PASSWORD: secret
        run: |
          cp .env.example .env
          php artisan key:generate
          # These fail loudly on a bad config, a bad route or a bad listener.
          php artisan config:cache
          php artisan route:cache
          php artisan event:cache
          php artisan about --only=environment

      - name: Check migrations apply to an empty database
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leadflow_verify
          DB_USERNAME: leadflow
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Refuse destructive commands in the deploy path
        run: ./scripts/check-deploy-safety.sh

  deploy:
    name: Deploy to production VPS
    needs: [verify]
    if: vars.PRODUCTION_ENABLED == 'true' && github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_DOMAIN || 'app.example.com' }}

    steps:
      - uses: actions/checkout@v4

      # Ship only what CI has passed.
      - name: CI must have passed for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/ci-is-green.sh "${{ github.sha }}" 600 | tee -a "$GITHUB_OUTPUT"

      - name: Refuse — CI is not green
        if: steps.ci.outputs.green != 'true'
        run: |
          echo "::error title=Production deploy refused::CI is not green for this commit (${{ steps.ci.outputs.green }})."
          exit 1

      - name: Require the deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_PATH_SECRET: ${{ secrets.PRODUCTION_PATH }}
        run: |
          # A deploy that cannot run must fail, not pass quietly. Skipping here
          # produced a green "Deploy production" on a run that shipped nothing, and
          # a release was tagged against it before anyone noticed.
          MISSING=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY DEPLOY_PATH_SECRET; do
            [ -n "${!name}" ] || MISSING="$MISSING $name"
          done

          if [ -n "$MISSING" ]; then
            LABEL="$(echo "$MISSING" | sed 's/DEPLOY_PATH_SECRET/PRODUCTION_PATH/')"
            {
              echo "## Deployment is not configured"
              echo ""
              echo "Missing repository secrets:**$LABEL**"
              echo ""
              echo "Every test passed — this is a configuration gap, not a code failure."
              echo "Production still runs the previous build."
              echo ""
              echo "Run \`./scripts/check-deploy-readiness.sh\` for the exact commands,"
              echo "or see \`EXTERNAL_SETUP.md\` section 2."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error title=Deployment not configured::Missing secrets:$LABEL — see the job summary."
            exit 1
          fi

          echo "### Deploying to production" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up the SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -e; \
             export PRODUCTION_PATH='${PRODUCTION_PATH:-/var/www/leads-crm/production}'; \
             export DEPLOY_BRANCH=main; \
             export DEPLOY_COMMIT='${{ github.sha }}'; \
             cd \"\$PRODUCTION_PATH\" && ./scripts/deploy-production.sh"

      - name: Verify production is healthy
        env:
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        run: |
          # A deploy nobody checked is not a deploy that worked.
          #
          # This used to exit 0 with a notice, so a run with no domain set went
          # green having proved nothing: the SSH step can succeed against a host
          # that then fails to boot, and the only thing that distinguishes a
          # release from a hopeful one is an HTTP response from the deployed
          # environment. Same reasoning as the missing-secrets guard above, one
          # step later in the same job.
          if [ -z "$PRODUCTION_DOMAIN" ]; then
            {
              echo "## Production deployed, and not verified"
              echo ""
              echo "The repository variable **PRODUCTION_DOMAIN** is not set, so nothing"
              echo "could check that production is actually serving the new build."
              echo ""
              echo "Set it under Settings → Secrets and variables → Actions → Variables."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error title=Cannot verify the deploy::PRODUCTION_DOMAIN is not set — see the job summary."
            exit 1
          fi

          for i in $(seq 1 12); do
            if curl -fsS "https://${PRODUCTION_DOMAIN}/api/health" | grep -q healthy; then
              echo "::notice title=Production is live::https://${PRODUCTION_DOMAIN}"
              exit 0
            fi
            sleep 5
          done

          echo "Production did not report healthy." >&2
          exit 1

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
