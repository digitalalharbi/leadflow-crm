name: Deploy staging

# Deploying is not testing. CI (ci.yml) runs on every push to develop and decides
# whether the code is healthy; this workflow only ships a commit that CI has passed,
# and only when a staging server has been set up. With no server it says so and ends —
# "not configured" is a state to fix, not a failure of the code, so it does not turn
# develop red. A deploy that is attempted and fails does.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Never run two deploys at the same host at once, and never cancel one halfway.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Is there somewhere to deploy to? Secrets cannot be tested in an `if:`, so this reads them
  # into the environment and reports the names that are missing — never their values.
  config:
    name: Staging configured?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
        run: |
          MISSING=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY STAGING_PATH STAGING_DOMAIN; do
            [ -n "${!name}" ] || MISSING="$MISSING $name"
          done

          if [ -z "$MISSING" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          {
            echo "### STAGING NOT CONFIGURED"
            echo ""
            echo "Nothing was deployed. Missing:**$MISSING**"
            echo ""
            echo "This is not a code failure: CI decides that. Run \`./scripts/check-deploy-readiness.sh\`"
            echo "for the exact commands, or see \`docs/GITHUB_FLOW.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Staging not configured::Missing:$MISSING — nothing deployed."

  deploy:
    name: Deploy to staging VPS
    needs: [config]
    if: needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN }}

    steps:
      - uses: actions/checkout@v4

      # Ship only what CI passed. Waiting for CI, not re-running it: CI is the authority.
      - name: CI must have passed for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/ci-is-green.sh "${{ github.sha }}" 2700 | tee -a "$GITHUB_OUTPUT"

      - name: Not deployed — CI is not green
        if: steps.ci.outputs.green != 'true'
        run: |
          {
            echo "### NOT DEPLOYED — CI is not green for this commit (${{ steps.ci.outputs.green }})"
            echo "Fix CI first; this workflow ships only what CI has passed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Not deployed::CI is not green for this commit (${{ steps.ci.outputs.green }})."

      - name: Set up the SSH key
        if: steps.ci.outputs.green == 'true'
        run: |
          mkdir -p ~/.ssh
          # Written from a secret and never echoed.
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        if: steps.ci.outputs.green == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -e; \
             export STAGING_PATH='${STAGING_PATH:-/var/www/leads-crm/staging}'; \
             export DEPLOY_BRANCH=develop; \
             export DEPLOY_COMMIT='${{ github.sha }}'; \
             cd \"\$STAGING_PATH\" && ./scripts/deploy-staging.sh"

      - name: Verify staging is serving the new build
        if: steps.ci.outputs.green == 'true'
        env:
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
        run: |
          # A deploy nobody checked is not a deploy that worked.
          #
          # This used to exit 0 with a notice, so a run with no domain set went
          # green having proved nothing: the SSH step can succeed against a host
          # that then fails to boot, and the only thing that distinguishes a
          # release from a hopeful one is an HTTP response from the deployed
          # environment. Same reasoning as the missing-secrets guard above, one
          # step later in the same job.
          if [ -z "$STAGING_DOMAIN" ]; then
            {
              echo "## Staging deployed, and not verified"
              echo ""
              echo "The repository variable **STAGING_DOMAIN** is not set, so nothing"
              echo "could check that staging is actually serving the new build."
              echo ""
              echo "Set it under Settings → Secrets and variables → Actions → Variables."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error title=Cannot verify the deploy::STAGING_DOMAIN is not set — see the job summary."
            exit 1
          fi

          for i in $(seq 1 10); do
            if curl -fsS "https://${STAGING_DOMAIN}/api/health" | grep -q healthy; then
              echo "::notice title=Staging is live::https://${STAGING_DOMAIN}"
              exit 0
            fi
            sleep 5
          done

          echo "Staging did not report healthy." >&2
          exit 1

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
