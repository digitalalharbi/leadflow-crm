name: E2E tests

on:
  # Called by CI (ci.yml), which owns every trigger.
  workflow_call:


jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    # The whole suite, one worker because every spec reseeds one database: 1000 tests at the
    # 7.7s a test measured on this runner is about 130 minutes, before any retry. The deploy
    # gate waits longer than this (deploy-production.yml), and a test pins the two together.
    timeout-minutes: 180

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadflow_e2e
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U leadflow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # The API the SPA and the specs both talk to.
      E2E_API_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:5173
      # Servers are started explicitly below, so Playwright must not try.
      E2E_NO_SERVER: '1'
      # Queued work (conversation reading, notifications, recovery) has no worker in this job;
      # it runs inline, exactly as in the local e2e API. Without it those specs wait for ever.
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      # Lives here rather than in the backend or frontend workflow because both
      # of those are scoped with `paths:` — a marker in a file neither of them
      # watches would reach develop unseen. This job runs on every pull request.
      - name: Check for conflict markers
        run: ./scripts/check-conflict-markers.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-e2e-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-e2e-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the backend
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leadflow_e2e
          DB_USERNAME: leadflow
          DB_PASSWORD: secret

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: frontend
        # Every browser the projects in playwright.config.ts run on.
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start the API
        working-directory: backend
        run: |
          # Several workers: a page makes many requests at once and polls. Laravel only honours
          # PHP_CLI_SERVER_WORKERS with --no-reload; without it the API serves one request at a time.
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=127.0.0.1 --port=8000 --no-reload > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leadflow_e2e
          DB_USERNAME: leadflow
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: predis
          # A browser suite signs in and reads constantly from one address; the
          # production defaults would throttle it. The limiters themselves are
          # covered by the backend suite, which pins its own values.
          LOGIN_RATE_LIMIT_PER_MINUTE: '500'
          LOGIN_RATE_LIMIT_PER_IP_PER_MINUTE: '2000'
          LOGIN_RATE_LIMIT_PER_ACCOUNT_PER_15_MINUTES: '100000'
          API_RATE_LIMIT_PER_MINUTE: '5000'

      - name: Start the SPA
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/ >/dev/null && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:5173/

      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test
        env:
          # The specs reseed fixtures by shelling into artisan.
          E2E_BACKEND_DIR: ${{ github.workspace }}/backend
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: leadflow_e2e
          DB_USERNAME: leadflow
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_CLIENT: predis

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Both folders start with a dot, and upload-artifact skips hidden files unless told.
          # Without this a failed run left no screenshot and no trace to read.
          include-hidden-files: true
          path: |
            frontend/e2e/.report
            frontend/e2e/.results
          retention-days: 7

      - name: Server logs on failure
        if: failure()
        run: |
          echo '--- API ---'; tail -100 /tmp/api.log || true
          echo '--- Vite ---'; tail -50 /tmp/vite.log || true
