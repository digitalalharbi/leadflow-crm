name: Frontend tests

on:
  pull_request:
    branches: [main, develop]
    paths: ['frontend/**', '.github/workflows/frontend-tests.yml']
  # Called by the deploy workflows, which own the push path — running on push
  # here as well would duplicate the work and cancel itself via `concurrency`.
  workflow_call:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # A build failure must stop a deploy, so it is part of CI, not of deploy.
      - name: Production build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 5
