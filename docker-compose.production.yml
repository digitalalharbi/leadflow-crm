# ---------------------------------------------------------------------------
# Production on the VPS. Built from `main` by scripts/deploy-production.sh,
# which takes a database backup before it runs migrations.
#
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
# ---------------------------------------------------------------------------
name: leadflow-production

x-backend-env: &backend-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_URL: https://${PRODUCTION_API_DOMAIN:?set PRODUCTION_API_DOMAIN}
  APP_CENTRAL_DOMAIN: ${PRODUCTION_DOMAIN:?set PRODUCTION_DOMAIN}
  FRONTEND_URL: https://${PRODUCTION_DOMAIN}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-leadflow_production}
  DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: database
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  # The host Nginx terminates TLS and proxies in over the docker bridge, so the
  # client IP arrives in X-Forwarded-For. Trusting '*' would let a caller forge
  # it past the login limiter, so name the proxy explicitly.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
  LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-5}
  LOGIN_RATE_LIMIT_PER_IP_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_IP_PER_MINUTE:-20}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-leadflow_production}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - production-postgres:/var/lib/postgresql/data
    # Not published on the host: only the compose network may reach it.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - production-redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    environment: *backend-env
    volumes:
      - production-storage:/var/www/html/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  api:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    # Bound to loopback; the host Nginx terminates TLS and proxies in.
    ports:
      - "127.0.0.1:9081:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: production
      args:
        VITE_API_URL: https://${PRODUCTION_API_DOMAIN}/api/v1
    ports:
      - "127.0.0.1:9080:80"
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    command: php artisan queue:work --tries=3 --timeout=300 --sleep=1 --max-time=3600
    environment: *backend-env
    volumes:
      - production-storage:/var/www/html/storage
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    command: php artisan horizon
    environment: *backend-env
    volumes:
      - production-storage:/var/www/html/storage
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Runs Laravel's scheduler (follow-up reminders, Horizon snapshots).
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    command: php artisan schedule:work
    environment: *backend-env
    volumes:
      - production-storage:/var/www/html/storage
    depends_on:
      backend: { condition: service_started }
    restart: unless-stopped

volumes:
  production-postgres:
  production-redis:
  production-storage:
