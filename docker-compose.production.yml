# ---------------------------------------------------------------------------
# Production on the VPS. Built from `main` by scripts/deploy-production.sh,
# which takes a database backup before it runs migrations.
#
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
# ---------------------------------------------------------------------------
name: leadflow-production

x-backend-env: &backend-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  # http only when the server has an IP and no certificate; see
  # docker/nginx/edge-ip.conf.example for what that costs.
  APP_URL: ${APP_SCHEME:-https}://${PRODUCTION_API_DOMAIN:?set PRODUCTION_API_DOMAIN}
  APP_CENTRAL_DOMAIN: ${PRODUCTION_DOMAIN:?set PRODUCTION_DOMAIN}
  FRONTEND_URL: ${APP_SCHEME:-https}://${PRODUCTION_DOMAIN}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-leadflow_production}
  DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: database
  # Read by the health endpoint to decide whether a caller may be told which
  # commit is serving. Empty means nobody may, which is the safe default.
  DEPLOY_SECRET: ${DEPLOY_SECRET:-}
  # `stack` so an alert channel can be added by setting LOG_STACK, with no
  # code change: LOG_STACK=stderr,slack plus LOG_SLACK_WEBHOOK_URL.
  LOG_CHANNEL: stack
  LOG_STACK: ${LOG_STACK:-stderr}
  LOG_LEVEL: info
  # The host Nginx terminates TLS and proxies in over the docker bridge, so the
  # client IP arrives in X-Forwarded-For. Trusting '*' would let a caller forge
  # it past the login limiter, so name the proxy explicitly.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
  # The SaaS: the platform console's own sign-in, subscriptions, account emails.
  PLATFORM_REQUIRE_MFA: ${PLATFORM_REQUIRE_MFA:-true}
  PLATFORM_SESSION_HOURS: ${PLATFORM_SESSION_HOURS:-12}
  PLATFORM_IMPERSONATION_MINUTES: ${PLATFORM_IMPERSONATION_MINUTES:-30}
  BILLING_PROVIDER: ${BILLING_PROVIDER:-manual}
  BILLING_PAST_DUE_GRACE_DAYS: ${BILLING_PAST_DUE_GRACE_DAYS:-14}
  TENANCY_DEFAULT_PLAN: ${TENANCY_DEFAULT_PLAN:-enterprise}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-مهتم}
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
  LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-5}
  LOGIN_RATE_LIMIT_PER_IP_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_IP_PER_MINUTE:-20}

x-logging: &default-logging
  # Docker's default json-file driver has no size limit, and every container here
  # logs to stderr. Left alone, a chatty queue worker fills the disk — and a full
  # disk takes the database down with it, which is a worse outage than any the
  # logs would have explained.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-leadflow_production}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - production-postgres:/var/lib/postgresql/data
    # Not published on the host: only the compose network may reach it.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - production-redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
      args:
        # Set by the deploy script so the image can identify itself over HTTP.
        APP_RELEASE: ${DEPLOY_COMMIT:-}
    # Every variable the operator put in the env file reaches the app.
    #
    # `--env-file` on the command line only feeds compose's own ${...}
    # interpolation: a container sees what is named under `environment:` and
    # nothing else. This file was therefore never read by the application —
    # the Google, Meta, TikTok and WhatsApp settings, the mail transport, the
    # Reverb keys and the super-admin password all came up empty, which is
    # indistinguishable from "not configured yet" and was discovered by
    # counting. `environment:` below still wins, so the values composed from
    # the domain and the forced production flags cannot be overridden by a
    # stray line in the file.
    env_file:
      - .env.production
    environment: *backend-env
    volumes:
      - production-storage:/var/www/html/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging

  api:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    # Bound to loopback; the host Nginx terminates TLS and proxies in.
    ports:
      - "127.0.0.1:9081:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: production
      args:
        VITE_API_URL: ${APP_SCHEME:-https}://${PRODUCTION_API_DOMAIN}/api/v1
        VITE_PUBLIC_LEGAL_NAME: ${VITE_PUBLIC_LEGAL_NAME:-}
        VITE_PUBLIC_CONTACT_EMAIL: ${VITE_PUBLIC_CONTACT_EMAIL:-}
        VITE_PUBLIC_ADDRESS: ${VITE_PUBLIC_ADDRESS:-}
        VITE_PUBLIC_PROCESSORS: ${VITE_PUBLIC_PROCESSORS:-}
    ports:
      - "127.0.0.1:9080:80"
    restart: unless-stopped
    logging: *default-logging

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
      args:
        APP_RELEASE: ${DEPLOY_COMMIT:-}
    command: php artisan horizon
    # Every variable the operator put in the env file reaches the app.
    #
    # `--env-file` on the command line only feeds compose's own ${...}
    # interpolation: a container sees what is named under `environment:` and
    # nothing else. This file was therefore never read by the application —
    # the Google, Meta, TikTok and WhatsApp settings, the mail transport, the
    # Reverb keys and the super-admin password all came up empty, which is
    # indistinguishable from "not configured yet" and was discovered by
    # counting. `environment:` below still wins, so the values composed from
    # the domain and the forced production flags cannot be overridden by a
    # stray line in the file.
    env_file:
      - .env.production
    environment: *backend-env
    volumes:
      - production-storage:/var/www/html/storage
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging

  # Runs Laravel's scheduler (follow-up reminders, Horizon snapshots).
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
      args:
        APP_RELEASE: ${DEPLOY_COMMIT:-}
    command: php artisan schedule:work
    # Every variable the operator put in the env file reaches the app.
    #
    # `--env-file` on the command line only feeds compose's own ${...}
    # interpolation: a container sees what is named under `environment:` and
    # nothing else. This file was therefore never read by the application —
    # the Google, Meta, TikTok and WhatsApp settings, the mail transport, the
    # Reverb keys and the super-admin password all came up empty, which is
    # indistinguishable from "not configured yet" and was discovered by
    # counting. `environment:` below still wins, so the values composed from
    # the domain and the forced production flags cannot be overridden by a
    # stray line in the file.
    env_file:
      - .env.production
    environment: *backend-env
    volumes:
      - production-storage:/var/www/html/storage
    depends_on:
      backend: { condition: service_started }
    restart: unless-stopped
    logging: *default-logging

  # The websocket server behind the live feed.
  #
  # Started whatever BROADCAST_CONNECTION says, because a container that exits
  # on a missing variable looks like a crash loop to whoever is deploying. It
  # is the application that decides whether anything is published to it: with
  # the connection set to `log` or `null` this process simply sits there, and
  # the browser never connects because the client needs VITE_REVERB_* to be set
  # at build time.
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
      args:
        APP_RELEASE: ${DEPLOY_COMMIT:-}
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    # Every variable the operator put in the env file reaches the app.
    #
    # `--env-file` on the command line only feeds compose's own ${...}
    # interpolation: a container sees what is named under `environment:` and
    # nothing else. This file was therefore never read by the application —
    # the Google, Meta, TikTok and WhatsApp settings, the mail transport, the
    # Reverb keys and the super-admin password all came up empty, which is
    # indistinguishable from "not configured yet" and was discovered by
    # counting. `environment:` below still wins, so the values composed from
    # the domain and the forced production flags cannot be overridden by a
    # stray line in the file.
    env_file:
      - .env.production
    environment: *backend-env
    volumes:
      - production-storage:/var/www/html/storage
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging
    # Not published to the host: the reverse proxy in front of this stack
    # terminates TLS and forwards /app and /apps to it, the same way it does
    # for the API. Opening 8080 to the internet would serve the socket without
    # a certificate.
    expose:
      - '8080'

volumes:
  production-postgres:
  production-redis:
  production-storage:
