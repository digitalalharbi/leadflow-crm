# ---------------------------------------------------------------------------
# Staging on the VPS. Images are built from the checked-out `develop` commit by
# scripts/deploy-staging.sh, which CI calls over SSH.
#
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
# ---------------------------------------------------------------------------
name: leadflow-staging

x-backend-env: &backend-env
  APP_ENV: staging
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  # http only when the server has an IP and no certificate; see
  # docker/nginx/edge-ip.conf.example for what that costs.
  APP_URL: ${APP_SCHEME:-https}://${STAGING_API_DOMAIN:?set STAGING_API_DOMAIN}
  APP_CENTRAL_DOMAIN: ${STAGING_DOMAIN:?set STAGING_DOMAIN}
  FRONTEND_URL: ${APP_SCHEME:-https}://${STAGING_DOMAIN}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-leadflow_staging}
  DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: database
  # Read by the health endpoint to decide whether a caller may be told which
  # commit is serving. Empty means nobody may, which is the safe default.
  DEPLOY_SECRET: ${DEPLOY_SECRET:-}
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  # The host Nginx terminates TLS and proxies in over the docker bridge, so the
  # client IP arrives in X-Forwarded-For. Trusting '*' would let a caller forge
  # it past the login limiter, so name the proxy explicitly.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
  LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-5}
  LOGIN_RATE_LIMIT_PER_IP_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_IP_PER_MINUTE:-20}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-leadflow_staging}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - staging-postgres:/var/lib/postgresql/data
    # Not published on the host: only the compose network may reach it.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - staging-redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
      args:
        # Set by the deploy script so the image can identify itself over HTTP.
        APP_RELEASE: ${DEPLOY_COMMIT:-}
    environment: *backend-env
    volumes:
      - staging-storage:/var/www/html/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  api:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    # Bound to loopback; the host Nginx terminates TLS and proxies in.
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: production
      args:
        VITE_API_URL: ${APP_SCHEME:-https}://${STAGING_API_DOMAIN}/api/v1
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
      args:
        APP_RELEASE: ${DEPLOY_COMMIT:-}
    command: php artisan horizon
    environment: *backend-env
    volumes:
      - staging-storage:/var/www/html/storage
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Runs Laravel's scheduler (follow-up reminders, Horizon snapshots).
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
      args:
        APP_RELEASE: ${DEPLOY_COMMIT:-}
    command: php artisan schedule:work
    environment: *backend-env
    volumes:
      - staging-storage:/var/www/html/storage
    depends_on:
      backend: { condition: service_started }
    restart: unless-stopped

  # The websocket server behind the live feed.
  #
  # Started whatever BROADCAST_CONNECTION says, because a container that exits
  # on a missing variable looks like a crash loop to whoever is deploying. It
  # is the application that decides whether anything is published to it: with
  # the connection set to `log` or `null` this process simply sits there, and
  # the browser never connects because the client needs VITE_REVERB_* to be set
  # at build time.
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
      args:
        APP_RELEASE: ${DEPLOY_COMMIT:-}
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment: *backend-env
    volumes:
      - staging-storage:/var/www/html/storage
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped
    # Not published to the host: the reverse proxy in front of this stack
    # terminates TLS and forwards /app and /apps to it, the same way it does
    # for the API. Opening 8080 to the internet would serve the socket without
    # a certificate.
    expose:
      - '8080'

volumes:
  staging-postgres:
  staging-redis:
  staging-storage:
