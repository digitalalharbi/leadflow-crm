server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns its routes; any unknown path renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached, or a deploy won't reach returning users.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The service worker must be re-checked on every visit, or an update never reaches an installed app.
    # (A location with its own add_header does not inherit the server-level ones, so nosniff is repeated.)
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/javascript;
    }

    # What makes the app installable: served as a manifest, and never held stale.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/manifest+json;
    }

    # The page shown when the server cannot be reached; the worker keeps its own copy.
    location = /offline.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
