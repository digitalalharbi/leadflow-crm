# Chat apps that fetch a link's title and picture without running its JavaScript. Only these are sent to the preview
# page below; people and search engines get the app.
map $http_user_agent $preview_crawler {
    default 0;
    ~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|LinkedInBot|Discordbot|SkypeUriPreview|Viber) 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The preview crawler's request makes two error_page jumps (418 -> @share_preview -> @app_shell); nginx follows a second
    # jump only with this on, and only when it is set at server level. Without it the crawler is handed the raw 502.
    recursive_error_pages on;

    # The SPA owns its routes; any unknown path renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A shared client report (/r/<token>, or the long /reports/share/<token>): the app for a person, and for a link-preview
    # crawler a small page with that report's own name, company and logo, so a link pasted into WhatsApp is not the same
    # generic card for every client. Never indexed.
    # Quoted: an unquoted "{20,64}" is read by nginx as the start of a block and the pattern is cut short.
    location ~ "^/(?:r|reports/share)/(?<share_token>[A-Za-z0-9]{20,64})/?$" {
        set $share_id $share_token;
        add_header X-Robots-Tag "noindex, nofollow" always;
        error_page 418 = @share_preview;
        if ($preview_crawler) {
            return 418;
        }
        try_files /index.html =404;
    }

    location @share_preview {
        resolver 127.0.0.11 valid=10s ipv6=off;
        # A crawler is not kept waiting half a minute when the name cannot be resolved.
        resolver_timeout 3s;
        set $api_upstream "http://leadflow-api:80";
        proxy_pass $api_upstream/share-preview/$share_id;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        # If the API cannot answer, the crawler still gets the app's own page rather than an error.
        error_page 400 401 403 404 500 502 503 504 = @app_shell;
    }

    location @app_shell {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # The login and the platform door are not for search engines (the page says so too; this says it before a script runs).
    location ~ ^/(login|platform|dashboard)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    # Hashed assets are immutable, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached, or a deploy won't reach returning users.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The service worker must be re-checked on every visit, or an update never reaches an installed app.
    # (A location with its own add_header does not inherit the server-level ones, so nosniff is repeated.)
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/javascript;
    }

    # What makes the app installable: served as a manifest, and never held stale.
    location = /site.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/manifest+json;
    }

    # The page shown when the server cannot be reached; the worker keeps its own copy.
    location = /offline.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
