<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The platform's own identity (brand kit): pine for the browser chrome until a workspace's colour
         resolves and repoints it at runtime. -->
    <meta name="theme-color" content="#0C2A25" />
    <!-- The front door (https://mohtam.pro/) is the one indexable page here; the app, the login and the shares say noindex themselves,
         and nginx says it for /login and /platform before any script runs. -->
    <meta name="description" content="مهتم — حوّل الاهتمام إلى فرصة. منصة تربط الحملات التسويقية بالعملاء المحتملين وفريق المبيعات والمعاينات والإيرادات، بعزل كامل لكل شركة ومشروع." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://mohtam.pro/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="مهتم" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:title" content="مهتم | حوّل الاهتمام إلى فرصة" />
    <meta property="og:description" content="منصة تربط الحملات التسويقية بالعملاء المحتملين وفريق المبيعات والمعاينات والإيرادات، بعزل كامل لكل شركة ومشروع." />
    <meta property="og:url" content="https://mohtam.pro/" />
    <meta property="og:image" content="https://mohtam.pro/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#1D5E52" />
    <!-- The platform default. Replaced at runtime by one built from the tenant's own branding, so a customer
         who installs this to a home screen gets their product and not ours. -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="مهتم" />
    <!-- Home-screen launch on iOS and Android: no browser chrome, a status bar that follows the page. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />
    <!-- Launch screens, one per iPhone/iPad size (device pixels / pixel ratio), so the first frame is the brand and not white. -->
    <link rel="apple-touch-startup-image" href="/splash/1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1668x2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- Replaced at runtime by the tenant's own system name; this is only what
         shows before branding resolves. -->
    <title>مهتم | حوّل الاهتمام إلى فرصة</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
