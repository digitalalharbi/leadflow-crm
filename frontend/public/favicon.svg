<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="مهتم">
  <title>مهتم</title>
  <!--
    The مهتم mark on its own tile. A stroked mark on transparency disappears
    into a browser tab; a filled tile keeps the product recognisable as a
    colour before it is recognisable as a shape, and the solid teal reads on
    both a light and a dark tab bar without a prefers-color-scheme switch.

    Proportions were chosen by rendering candidates at 16px rather than by
    scaling the logo down: what fails first at that size is the hole inside the
    loop, so the mark is set LARGER in the tile and the stroke THINNER than the
    logo's (3.3 against 3.4 on the same grid). The tail survives from 24px up
    and merges into the loop below that, which is the right thing to lose last
    — the dot and the opening are what make the mark recognisable.
  -->
  <rect width="32" height="32" rx="7.5" fill="#12A594"/>
  <g transform="translate(0.158 1.372) scale(0.92)" fill="none" stroke="#fff"
     stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18.96 7.75 A6.9 6.9 0 1 0 21.87 12.80 M13.57 20.15 Q14.00 23.80 9.60 25.60"/>
    <circle cx="24.79" cy="7.75" r="3.2" fill="#fff" stroke="none"/>
  </g>
</svg>
