        min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);

      }
      main { max-width: 26rem; width: 100%; text-align: center; background: var(--card); border-radius: 1.5rem; padding: 2rem 1.5rem; border: 1px solid var(--line); }
      h1 { font-size: 1.375rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; color: var(--muted); line-height: 1.8; font-size: 1rem; }
      button {
        appearance: none; -webkit-appearance: none; border: 0; border-radius: 999px; background: var(--brand); color: #ffffff; font: inherit; font-weight: 600;
        padding: 0.75rem 1.75rem; min-height: 2.75rem; cursor: pointer;
      }
      button:hover { background: var(--brand-hover); }
      button:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 40%, transparent); outline-offset: 3px; }
